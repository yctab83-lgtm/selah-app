<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A2A"/>
      <stop offset="50%" stop-color="#0B253A"/>
      <stop offset="100%" stop-color="#0E4264"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Rays of Light -->
  <g opacity="0.15">
    <line x1="256" y1="210" x2="256" y2="70" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="210" x2="160" y2="90" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <line x1="256" y1="210" x2="352" y2="90" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <line x1="256" y1="210" x2="90" y2="140" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="256" y1="210" x2="422" y2="140" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Open Bible Pages -->
  <!-- Left Page -->
  <path d="M256 340 C210 322 150 320 110 330 C104 331 100 326 100 320 L100 200 C100 194 105 189 111 188 C155 178 215 182 256 200 Z" fill="url(#page)"/>
  <!-- Left Page Shadow/Depth -->
  <path d="M256 348 C210 330 150 328 110 338 C104 339 100 334 100 328 L100 320 C100 326 104 331 110 330 C150 320 210 322 256 340 Z" fill="#94A3B8"/>

  <!-- Right Page -->
  <path d="M256 340 C302 322 362 320 402 330 C408 331 412 326 412 320 L412 200 C412 194 407 189 401 188 C357 178 297 182 256 200 Z" fill="url(#page)"/>
  <!-- Right Page Shadow/Depth -->
  <path d="M256 348 C302 330 362 328 402 338 C408 339 412 334 412 328 L412 320 C412 326 408 331 402 330 C362 320 302 322 256 340 Z" fill="#94A3B8"/>

  <!-- Center Spine / Glow -->
  <path d="M254 200 L254 346 C255 347 257 347 258 346 L258 200 Z" fill="#0E3452"/>

  <!-- Graceful Cross Emerging above Bible -->
  <g transform="translate(256, 175)">
    <!-- Vertical Cross Beam -->
    <rect x="-7" y="-68" width="14" height="66" rx="4" fill="url(#gold)"/>
    <!-- Horizontal Cross Beam -->
    <rect x="-24" y="-52" width="48" height="12" rx="3.5" fill="url(#gold)"/>
    <!-- Cross center jewel/glow -->
    <circle cx="0" cy="-46" r="3" fill="#FFF"/>
  </g>

  <!-- Selah Wordmark at Bottom inside icon -->
  <text x="256" y="420" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="46" font-weight="700" letter-spacing="8" fill="#F1F5F9" text-anchor="middle">
    SELAH
  </text>
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#38BDF8" text-anchor="middle">
    BYBEL &amp; GEBED
  </text>
</svg>
